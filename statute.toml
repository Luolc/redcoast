# Written by `statute init`; `statute add` and `statute remove` change the rules.
constitution = { source = "R", edition = "2026-10" }
public = true

domains = [
  # Agents write and change this repository's own rules in .statute/rules/.
  "R96",
  # The repository keeps a design, docs/design.md.
  "R232",
]

rules = [
  # main is protected and takes changes only through reviewed pull requests.
  "R57",
  # The repository is public: a reviewer reads what is pushed before the push.
  "R52",
  # On a pull request, the run of check is what counts, not a full local run.
  "R72",
  # check is not a required status check: a merge does not wait for it (L9), but a
  # pull request whose check already failed at the approved head is not merged.
  "R211",
  # CI runners are pinned to a fixed Ubuntu release.
  "R212",
  # The rehearsals run on made-up accounts, a fake upstream and a fake exit (L11).
  "R27",
  # A release tags only a commit whose push run of ci.yml on main passed on the first
  # attempt (the release-ci-green action in release.yml).
  "R58",
  # Manuals live next to their code here; L6 takes the place of R207. R207 is listed
  # only so that L6 does not override a rule nothing else enables.
  "R207",
  "L6",
]

exclude = [
  # The design is one file, docs/design.md (L1): not split by topic,
  "R113",
  # and so with no index.
  "R114",
]

[language]
code-comments = "en"
docs = "en"
commits = "en"
pull-requests = "en"
# What agents write to a person here is in English, as the repository is; a person who
# reads another language sets it in their own configuration.
communication = "en"
