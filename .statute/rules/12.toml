[title]
en = "Bump a pinned tool version in a pull request of its own"

[text.statement]
en = "Change a tool version pinned in `tools/*.mod`, `go.mod`, the workflows under `.github/workflows/` or `.pre-commit-config.yaml` only in a pull request that changes nothing else; the `rev` of the `statute-compile` hook is the exception, and changes together with `statute.lock`."

[text.reason]
en = '''
A new tool version can change what the checks report; on its own, a change in their result is the bump's and nothing else's. `statute compile --check` refuses a lock file another statute version wrote, so the hook's `rev` and the version in `statute.lock` must move in the same commit.
'''

[text.verification]
en = '''
Violated when a pull request changes a pinned tool version together with any other change, other than the `rev` of the `statute-compile` hook together with `statute.lock`.
'''
