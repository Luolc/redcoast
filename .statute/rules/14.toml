[title]
en = "Bump only the last component of the version, unless the maintainer asks otherwise"

[text.statement]
en = "In a release pull request, raise only the last component of the version in `cmd/redcoast/version.go` by one (0.1.0 to 0.1.1), unless the maintainer asks for a different version."

[text.reason]
en = '''
Which version a release gets is the maintainer's choice; the smallest step is the default when they have not said, so a release never claims a larger change than they meant.
'''

[text.verification]
en = '''
Violated when a release pull request raises another component, or the last one by more than one, without the maintainer having asked for that version.
'''
