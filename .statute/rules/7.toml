[title]
en = "The checks a change touches, by what it changes"

[text.statement]
en = "The checks a change here touches, run from the repository root, are a secret scan of the branch (`gitleaks git --redact .`, never without `--redact`, so that a hit does not print the secret), the commit hooks on all files (`uvx pre-commit run --all-files`) and the release guard tests (`.github/scripts/release-tag-guard.test.sh`, `.github/scripts/release-on-main.test.sh`) for every change; `go vet ./...`, `go tool -modfile=tools/golangci-lint.mod golangci-lint run ./...` and `go test -race ./...` as well for a change to the `go` group; `(cd experiments && uv run --no-project --python 3.14 --with pytest==9.1.1 --with pyyaml==6.0.3 python -m pytest -q tests)` for a change to the `experiments` group; and, in `dashboard/` with the Node and pnpm versions it pins (`.node-version`, `packageManager`), `pnpm install --frozen-lockfile`, `pnpm peers check`, `pnpm run format:check`, `pnpm run lint`, `pnpm run test`, `pnpm run knip` and `pnpm run build` for a change to the `dashboard` group. A change to a path in no group, or under `.github/`, `tools/` or `.golangci.yml`, touches all of them."

[text.reason]
en = '''
{@rule:R53} asks for the checks a change touches, as the project's instructions list them; this is that list. It follows the jobs of `.github/workflows/ci.yml`: its `changes` job gives the groups (`go`, `experiments`, `dashboard`, `e2e`, `docs`) and the paths that run every group, `lint` runs on every change, and `go`, `experiments` and `dashboard` run when their group changed. `check` passes when each of those jobs passed or was skipped because its group did not change.
'''

[text.verification]
en = '''
The hooks (installed as {@rule:L8} says) run gitleaks on the staged changes, the tailnet address check, the skill frontmatter check, gofmt and `statute compile --check`. In CI, `lint` first runs the gitleaks action on the commits of the pull request or push (the whole history on the weekly run), then the hooks on all files with gitleaks skipped, then the release guard tests. `e2e` and `govulncheck` run in CI in jobs of their own that `check` does not need; the rehearsals are run locally as `e2e/README.md` and `experiments/README.md` say.

Violated when a change is pushed without a check this list gives for the paths it changes having passed on the pushed version.
'''
