[title]
en = "Edit `docs/design.md` only in a pull request whose purpose is to update the design"

[text.statement]
en = "Change `docs/design.md` only in a pull request whose purpose is to update the design; every other pull request leaves the file as it is."

[text.reason]
en = '''
A change to the design is then reviewed for itself, against the code as it is, and not as a side effect of a code change. {@rule:R81} lets the code and the design change apart; {@rule:L5} has each other pull request say how it bears on the design.
'''

[text.verification]
en = '''
Violated when a pull request whose purpose is not to update the design changes `docs/design.md`.
'''
