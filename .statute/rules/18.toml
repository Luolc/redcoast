id = 18
slug = "release-merged-changes-without-asking"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = "R268"
default = "on"
authority = ["relaxations.project-overrides", "advance-authorization.listed-items"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "The agent responsible for the work releases changes already merged into `main` without asking"

[text.statement]
en = "Under {@constitution:relaxations.project-overrides}, this project moves from {@constitution:must-ask}, both as the item {@rule:R32} adds and as far as a release is an irreversible external effect ({@constitution:must-ask.irreversible-effects}), to {@constitution:decide-yourself}, for the agent responsible for the work that needs it, one class of release only: pushing the tag `v<version>` as {@rule:13} says, where the release pull request raised only the last component of the version by one, as {@rule:14} does by default, on a commit of `main` that {@rule:R58} lets be released and whose changes, the version bump included, all reached `main` through reviewed pull requests; a release outside these conditions, and anything else, such as a change that stops a running service ({@rule:R33}), starting or stopping a service, funds or usage quotas, or another change to a machine, still goes through a principal."

[text.reason]
en = '''
The maintainer authorized this in advance: the releases that merged changes need may be made without asking each time. {@rule:R32} makes every release an item of {@constitution:must-ask}, and pushing a tag here also publishes builds and a version of the Go module that outside caches keep for good, an irreversible external effect ({@constitution:must-ask.irreversible-effects}); under {@constitution:relaxations.project-overrides} this rule moves, for this project only and under both items, the one class of release above to {@constitution:decide-yourself}, which makes it the maintainer's advance authorization of that class, written into this repository's instructions as {@constitution:advance-authorization.listed-items} requires. As {@constitution:relaxations} requires, the maintainer's approval of this declaration is given on the pull request that adds it.

The conditions keep each step that a person or a check already controls: every change released, the version bump included, has been reviewed and merged ({@rule:R57}); the tag names the version the release pull request set ({@rule:13}), which is the smallest step ({@rule:14}); and the release workflow publishes nothing unless the commit is on `main` and its CI passed there on the first attempt ({@rule:R58}). What the maintainer did not grant stays with them: a larger version step, releasing a commit not on `main`, and installing or deploying a release anywhere, which is for the instructions of whatever installs it.
'''

[text.verification]
en = '''
The agent responsible for the work is the one that answers for the task the release serves; an agent that only implements or reviews a part of it does not decide the release. This rule grants no review or merge: a release pull request is reviewed and merged as any other.

Not covered, so still going through a principal: a version that raises anything other than the last component by one; a tag on a commit that is not on `main`, or whose push run of CI on `main` did not pass on its first attempt; deleting or moving a pushed tag or a published release; and every act outside this repository's release, such as installing, deploying or upgrading a release on a machine, a change that stops a running service ({@rule:R33}), starting or stopping a service, and spending funds or usage quotas.

Violated when an agent pushes a release tag under this rule that does not meet its conditions, when an agent other than the one responsible for the work decides such a release, or when an agent treats an act that is not covered as covered by this rule.
'''
