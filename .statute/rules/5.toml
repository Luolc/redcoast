[title]
en = "Fill in \"Design impact\" in the description of every pull request"

[text.statement]
en = "In the description of every pull request, under \"Design impact\" (`.github/pull_request_template.md`), name the section or invariant of `docs/design.md` the change alters and the test that guards it, or write \"none\"."

[text.reason]
en = '''
The reviewer then checks the change against the part of the design it claims to touch, and a pull request that updates no design but changes its subject says so where it can be read, as {@rule:R81} asks.
'''

[text.verification]
en = '''
{@rule:L17} sets how a review ranks a "none" that is wrong.

Violated when a pull request description leaves "Design impact" empty, or says "none" for a change that alters a section or an invariant of `docs/design.md`.
'''
