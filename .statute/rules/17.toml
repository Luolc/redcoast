[title]
en = "Rank as P0 a change that breaks an invariant of the design while its \"Design impact\" says \"none\""

[text.statement]
en = "In a review, rank as P0 a change that breaks an invariant `docs/design.md` lists while the pull request's \"Design impact\" says \"none\"."

[text.reason]
en = '''
The invariants are what the design promises and the tests guard ({@rule:L3}); a change that breaks one while saying it touches nothing would leave the design stating as true what no longer is, with no one asked to decide it.
'''

[text.verification]
en = '''
Violated when a verdict approves such a change, or ranks that finding below P0.
'''
