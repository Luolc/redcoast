[title]
en = "Send a request to a provider's real upstream for an account only through that account's exit"

[text.statement]
en = "Send each request that an experiment, probe or debugging session makes to a provider's real upstream for an account through the exit that the account's inventory file names under `proxy`, never directly from the machine the work runs on or through any other exit; when that exit cannot be used, send nothing to the upstream for that account and tell whoever delegated the work what stops it."

[text.reason]
en = '''
The gateway sends all of an account's traffic through the account's exit and never direct (`docs/design.md`), so the upstream it reaches, and whether it reaches it at all, is what that exit lets through. A request sent directly from a developer machine, or through another exit, passes however the account's exit treats the upstream host, and so cannot show that the gateway can reach it ({@constitution:discriminating-checks}): an exit that refuses a provider's upstream host by name went unnoticed because the real-upstream experiments ran directly from a developer machine and never through the account's exit.

The means already exist: each account file of the inventory names its exit under `proxy`, `--real-once` of `experiments/hi.py` sends its real requests through the account's real exit, and the gateway run with the real inventory sends through it on its own.
'''

[text.verification]
en = '''
A request is for an account when it carries the account's credential, or when its result is used to show what the gateway or that account can reach upstream or how the upstream answers it. A provider's real upstream is a host of the provider itself, such as the API or login host the gateway forwards to, not a fake upstream. The exit cannot be used when the account file names none, its credentials cannot be resolved where the work runs, or it refuses or fails the request; its refusal is a result to report, not a reason to try another route.

This rule grants nothing: whether a real request may be sent at all is for the other rules and the task. It does not reach CI, which sends no request to a real account ({@rule:11}).

Violated when such a request goes directly from the machine the work runs on, or through an exit other than the one the account's file names. A report of a real-upstream run that does not say which account's exit it went through does not show that this rule was met.
'''
