# Commit hooks: a secret scan of the staged changes, then the checks of CI's
# lint job that take seconds, then the statute compile check. CI runs them all
# with --all-files.
repos:
  # First, so that a secret is stopped before any other hook runs. The
  # upstream entry already has --staged and --redact; --redact is repeated so
  # that a rev bump cannot silently drop it. On a rev bump, check that the
  # upstream entry still ends in --staged.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  - repo: local
    hooks:
      # Scans every tracked file, so it runs once, whatever changed.
      - id: tailnet-literals
        name: tailnet address literals
        entry: .github/scripts/check-tailnet-literals.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: skill-frontmatter
        name: skill frontmatter
        entry: python .github/scripts/check-skill-frontmatter.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^\.agents/skills/[^/]+/SKILL\.md$
      # gofmt -l exits 0 even when it lists files.
      - id: gofmt
        name: gofmt
        entry: sh -c 'out=$(gofmt -l "$@") && [ -z "$out" ] || { printf "gofmt differs:\n%s\n" "$out" >&2; exit 1; }' --
        language: system
        types: [go]
  # AGENTS.md and the skills statute copies and links must match a fresh
  # compile of statute.toml and statute.lock; the private output, which git
  # ignores, is not compared. rev must name the statute version in
  # statute.lock: statute refuses a lock another version wrote, so the hook
  # fails until the two agree.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.25
    hooks:
      - id: statute-compile
