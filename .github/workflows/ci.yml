# `changes` decides which path groups a change touches; `lint` always runs;
# `go`, `experiments` and `dashboard` run when their group changed, in
# parallel. `check` passes only when every job it needs passed, or was
# skipped because its group need not run (see AGENTS.md, "Checks"). `e2e`
# and `govulncheck` also run only when their paths changed; `check` does not
# need them. No step uses a credential: the rehearsals run on made-up
# accounts, a fake upstream and a fake exit; only the hi rehearsal runs the
# real Claude CLI.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run of everything, including a secret scan of the whole history
  # (gitleaks-action scans all commits on schedule and workflow_dispatch).
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  # Every main commit needs a result of its own, so each one gets its own
  # group: a shared group would cancel a pending run when a newer one
  # arrives. On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the last green run of this workflow on main
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A changed file in no group runs every group.
      - id: changes
        uses: Luolc/ci-actions/changes@afb3a5a9525f6153c9ce996c547b0a714115137e # main, 2026-10-11
        with:
          groups: |
            go: cmd/** claude/** session/** credential/** backup/** internal/** go.mod go.sum redcoast.example.yaml
            experiments: experiments/**
            dashboard: dashboard/**
            e2e: cmd/** claude/** session/** credential/** backup/** internal/** go.mod go.sum e2e/** experiments/**
            docs: docs/** **/*.md LICENSE .agents/** .claude/**
          run-all-on: .github/** tools/** .golangci.yml

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan reads commits, and a shallow clone would hide all but
          # the latest one.
          fetch-depth: 0

      # Scans the commits of this PR or push; on schedule and
      # workflow_dispatch, the whole history.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job
          # log and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Tailnet address literals
        run: .github/scripts/check-tailnet-literals.sh

      - uses: astral-sh/setup-uv@v6

      - name: Skill frontmatter
        run: uv run --no-project --python 3.14 --with pyyaml==6.0.3 python .github/scripts/check-skill-frontmatter.py .agents/skills/*/SKILL.md

      - name: Release guard tests
        run: |
          set -eu
          .github/scripts/release-tag-guard.test.sh
          .github/scripts/release-on-main.test.sh

  go:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/golangci-lint.sum

      - name: Go format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt differs:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        run: go tool -modfile=tools/golangci-lint.mod golangci-lint run ./...

      - name: Go tests
        run: go test -race ./...

  experiments:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      # hi.py and its tests need Python 3.14 and PyYAML; the two programs
      # it mounts into python:3.13-slim containers run there in the e2e job.
      - name: Experiments unit tests
        working-directory: experiments
        run: uv run --no-project --python 3.14 --with pytest==9.1.1 --with pyyaml==6.0.3 python -m pytest -q tests

  dashboard:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Reads the pnpm version from packageManager.
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false

      - name: Dashboard frontend
        working-directory: dashboard
        run: |
          set -eu
          pnpm install --frozen-lockfile
          # Fails on an unmet peer range, such as a TypeScript newer than
          # typescript-eslint supports.
          pnpm peers check
          pnpm run format:check
          pnpm run lint
          pnpm run test
          pnpm run knip
          pnpm run build

  check:
    needs: [changes, lint, go, experiments, dashboard]
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: Luolc/ci-actions/all-green@afb3a5a9525f6153c9ce996c547b0a714115137e # main, 2026-10-11
        with:
          needs: ${{ toJSON(needs) }}

  # Not required: a red run does not block a merge, it asks for a look
  # (AGENTS.md, "Checks").
  e2e:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Static binaries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/redcoast" ./cmd/redcoast
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/redcoast-client" ./cmd/redcoast-client

      # Gateway and client containers on the runner's Docker; see
      # e2e/README.md.
      - name: Sessions across machines (fake claude)
        run: >-
          python3 e2e/xmachine.py
          --gateway-binary "$RUNNER_TEMP/bin/redcoast"
          --launcher-binary "$RUNNER_TEMP/bin/redcoast-client"
          --out "$RUNNER_TEMP/xmachine"

      - uses: astral-sh/setup-uv@v6

      # The hi rehearsal with the real Claude CLI at a pinned version against
      # a fake API and a fake exit; see experiments/README.md.
      - name: hi rehearsal, synthetic cases
        run: >-
          experiments/ci-cases.sh
          "$RUNNER_TEMP/bin/redcoast"
          "$RUNNER_TEMP/bin/redcoast-client"
          "$RUNNER_TEMP/hi"

  # Known vulnerabilities in the dependencies and the standard library. Not
  # required: a new advisory can turn it red without any change here. The
  # weekly run checks it whatever changed.
  govulncheck:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/govulncheck.sum
      - run: go tool -modfile=tools/govulncheck.mod govulncheck ./...
