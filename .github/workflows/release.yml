# Publishes static linux/amd64 builds of redcoast and redcoast-client, the
# two client shims and SHA256SUMS over all four to a GitHub Release when a v*
# tag is pushed (cmd/redcoast-client/README.md says how they are installed).
# Pushing the tag is the release itself, so only the maintainer does it. The
# builds are reproducible: the same commit and Go toolchain give the same
# SHA-256.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version
        run: .github/scripts/release-tag-guard.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Static builds
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          mkdir dist
          for cmd in redcoast redcoast-client; do
            go build -trimpath -buildvcs=false -o "dist/${cmd}-linux-amd64" "./cmd/${cmd}"
          done
          install -m 0755 cmd/redcoast-client/redcoast-client-shim cmd/redcoast-client/redcoast-client-shim-full dist/
          (cd dist && sha256sum redcoast-linux-amd64 redcoast-client-linux-amd64 redcoast-client-shim redcoast-client-shim-full >SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Static linux/amd64 builds of redcoast and redcoast-client, and the client shims (installed as claude, see cmd/redcoast-client/README.md). Check them with sha256sum -c SHA256SUMS." \
            dist/redcoast-linux-amd64 dist/redcoast-client-linux-amd64 \
            dist/redcoast-client-shim dist/redcoast-client-shim-full dist/SHA256SUMS
