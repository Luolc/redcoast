# Publishes static linux/amd64 builds of redcoast and redcoast-client, the
# two client shims, the dashboard page and SHA256SUMS over all five to a
# GitHub Release when a v* tag is pushed (cmd/redcoast/README.md and
# cmd/redcoast-client/README.md say how they are installed). Pushing the tag
# is the release itself; who may push it is in L13 and L18 of AGENTS.md. The
# builds are reproducible: the same commit, Go toolchain and Node and pnpm
# versions give the same SHA-256. Only a commit on main whose CI passed there
# is released.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published unless all three hold. A failed guard leaves the
  # tag in place; deleting it is up to whoever pushed it.
  guard:
    runs-on: ubuntu-24.04
    # The CI run of the commit may still be running; release-ci-green
    # waits up to 30 minutes for it.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # read the CI runs of the commit
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard below compares against origin/main, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Tag matches the version
        run: .github/scripts/release-tag-guard.sh "$GITHUB_REF_NAME"

      # The commit, not the object of an annotated tag.
      - name: Tagged commit
        run: |
          commit=$(git rev-parse --verify "$GITHUB_REF^{commit}")
          echo "TAG_COMMIT=$commit" >>"$GITHUB_ENV"

      - name: Commit is on main
        run: .github/scripts/release-on-main.sh "$TAG_COMMIT" origin/main

      - name: CI passed on main, first attempt
        uses: Luolc/ci-actions/release-ci-green@afb3a5a9525f6153c9ce996c547b0a714115137e # main, 2026-10-11
        with:
          sha: ${{ env.TAG_COMMIT }}

  release:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v6
        with:
          # Reads the pnpm version from packageManager.
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false

      # One self-contained index.html in dashboard/dist; the page shows the
      # commit it was built from.
      - name: Dashboard page
        working-directory: dashboard
        env:
          DASHBOARD_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Static builds
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          mkdir dist
          for cmd in redcoast redcoast-client; do
            go build -trimpath -buildvcs=false -o "dist/${cmd}-linux-amd64" "./cmd/${cmd}"
          done
          install -m 0755 cmd/redcoast-client/redcoast-client-shim cmd/redcoast-client/redcoast-client-shim-full dist/
          install -m 0644 dashboard/dist/index.html dist/redcoast-dashboard.html
          (cd dist && sha256sum redcoast-linux-amd64 redcoast-client-linux-amd64 redcoast-client-shim redcoast-client-shim-full redcoast-dashboard.html >SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Static linux/amd64 builds of redcoast and redcoast-client, the client shims (installed as claude, see cmd/redcoast-client/README.md) and the dashboard page (installed as index.html in dashboard_dir, see cmd/redcoast/README.md). Check them with sha256sum -c SHA256SUMS." \
            dist/redcoast-linux-amd64 dist/redcoast-client-linux-amd64 \
            dist/redcoast-client-shim dist/redcoast-client-shim-full \
            dist/redcoast-dashboard.html dist/SHA256SUMS
