# Example configuration of redcoast, started as
#   redcoast claude serve --config <path>
# The four paths marked required must be set; credentials and backup are
# examples; every other key shows its default. Unknown keys are refused.
# Credentials appear only as references: op://vault/item/field (1Password),
# env://NAME or file:///absolute/path.

upstream: https://api.anthropic.com

listen:
  # One IP literal and port each, all different. Loopback and private
  # addresses (RFC 1918, 100.64.0.0/10, IPv6 ULA) are accepted; a public IP
  # needs allow_public: true.
  reverse: 127.0.0.1:8789
  forward: 127.0.0.1:8791
  health: 127.0.0.1:7804
  dashboard: 127.0.0.1:7805
  session: "" # TCP session interface for other machines; empty for none
  # health and dashboard answer only requests whose Host is the IP of their
  # listen address, tls.server_name or one of these lower-case DNS names (any
  # port); any other Host, or another page's Origin, gets 403.
  host_names: []
  allow_public: false
  # TLS on every listener above, with one certificate read at start and on a
  # handoff. Sessions are handed https://<server_name>:<port>, so the
  # certificate must cover server_name; on a public address use one a public
  # CA signed. Without this section the listeners are plain HTTP.
  # tls:
  #   cert_file: /etc/redcoast/tls/fullchain.pem
  #   key_file: /etc/redcoast/tls/privkey.pem
  #   server_name: gateway.example.test

session_socket: /run/redcoast/session.sock # required
admin_socket: /run/redcoast/admin.sock # required
session_db: /var/lib/redcoast/sessions.db # required
inventory: /etc/redcoast/inventory # required
dashboard_dir: "" # built dashboard frontend; empty serves only /dashboard.json
# The other providers' dashboards, which the page links to for switching;
# empty shows only this one. Each url is an http or https URL without a user
# name or password, or :<port> for the page's own scheme and host at that
# port, which follows whatever name or ssh tunnel reached this dashboard (the
# tunnel must then keep the remote ports). The page only navigates there;
# that dashboard checks the Host itself, so the name must be one it answers.
dashboard_links: []
# dashboard_links:
#   - provider: codex
#     url: ":7807"
# Account writes from the dashboard (the Claude gateway only): create, edit, verify
# and activate an account. The Claude accounts live in the database from the first
# start on (cmd/redcoast/README.md). allow_from lists the TCP peer addresses writes
# are accepted from, IP addresses or prefixes (never /0); empty accepts none, and
# the dashboard hides the editing. The peer address is the one the connection comes
# from; X-Forwarded-For and Forwarded are not read, so a reverse proxy in front of the
# dashboard shows up as its own address. token_ref_template is the token reference of
# a new account with {alias} in place of its alias; empty lets no account be created.
dashboard_write:
  allow_from: []
  token_ref_template: ""
# dashboard_write:
#   allow_from: ["192.0.2.0/24"]
#   token_ref_template: "op://example-vault/claude-oauth-token-{alias}/credential"
# setup lets a login machine, a separate host that reaches the management socket over
# a restricted ssh key, log an account in and hand its setup token to the gateway, which
# tries the token with one quota request and writes it to the secret store at the
# account's token reference (the template above). It needs credentials.onepassword_token
# and token_ref_template, and the 1Password service account must be allowed to write
# the vault the template names. Off, the setup routes answer 501.
setup:
  enabled: false
# Account commands on the management socket (account create, show, verify, activate and
# setup request, for an agent acting on a message). Needs dashboard_write.token_ref_template.
# Off, the writing ones answer 501. The Codex gateway refuses this key.
admin_write:
  enabled: false
capture_dir: ""

egress_interval: 15m

limits:
  idle_timeout: 5m
  max_request_duration: 1h
  max_tunnel_duration: 6h
  max_tunnels: 256
  account_concurrency: 32

retention:
  traffic_days: 180
  session_days: 365

credentials:
  # env:// or file:// reference of a 1Password service account token; without
  # it, op:// references are refused.
  onepassword_token: file:///run/credentials/redcoast.service/op-sa-token

# Hourly backups to an S3-compatible bucket, addressed path-style. Leave the
# section out to take none.
backup:
  endpoint: https://s3.us-east-1.amazonaws.com
  bucket: example-gateway-backup
  region: us-east-1
  prefix: redcoast
  access_key_id: op://example-vault/backup-writer/access key id
  secret_access_key: op://example-vault/backup-writer/secret access key
